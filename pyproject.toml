[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sw-mcp"
version = "0.1.0"
description = "MCP server that drives a local SolidWorks instance over COM for parametric part modelling."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nejc Dvorsek" }]
keywords = ["solidworks", "mcp", "cad", "com", "parametric", "3d-printing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # Windows-only; elsewhere the server starts and lists its tools, calls fail loud.
    "pywin32>=306; sys_platform == 'win32'",
    # mcp 2.x renamed FastMCP (server.py fails on import); 1.26+ is verified.
    "mcp>=1.26,<2",
]

[project.urls]
Homepage = "https://github.com/NejcDvorsek/sw-mcp"
Repository = "https://github.com/NejcDvorsek/sw-mcp"
Changelog = "https://github.com/NejcDvorsek/sw-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/NejcDvorsek/sw-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sw-mcp = "sw_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sw_mcp = ["guide.md", "material_ids.json"]  # the guide resource; English material ids

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "solidworks: integration test that needs a running SolidWorks instance",
]
